# dsh-wsl-kit — ready profile rows
# Append to your DeepSeek Harness profile cordis.patch.yml after installing the plugins.
# Install plugins first (see README); this file only configures them.

- insert:
    - id: dsh-wsl-env
      name: dsh-wsl-env
      config:
        when: wsl
        order: 15
        extraNotes: ""

    - id: dsh-wsl-net
      name: dsh-wsl-net
      config:
        timeoutMs: 20000
        probeTimeoutMs: 5000
        injectChildProxy: true

    - id: dsh-wsl-open
      name: dsh-wsl-open
      config:
        enabled: true

    - id: dsh-repeat-stop
      name: dsh-repeat-stop
      config:
        enabled: true
        threshold: 6
        exclude:
          - job_output
          - job_list
          - job_kill

    - id: dsh-tool-budget
      name: dsh-tool-budget
      config:
        enabled: true
        maxCalls: 80
        exclude:
          - job_output
          - job_list
          - job_kill

    - id: dsh-wsl-clipboard
      name: dsh-wsl-clipboard
      config:
        timeoutMs: 15000
        maxChars: 100000

    - id: dsh-wsl-launch
      name: dsh-wsl-launch
      config:
        timeoutMs: 20000

    - id: dsh-wsl-path
      name: dsh-wsl-path
      config: {}

    - id: dsh-wsl-gpu
      name: dsh-wsl-gpu
      config:
        timeoutMs: 20000

    - id: dsh-wsl-port
      name: dsh-wsl-port
      config:
        timeoutMs: 15000
        defaultPort: 3080

    - id: dsh-wsl-distro
      name: dsh-wsl-distro
      config:
        timeoutMs: 15000

    - id: dsh-wsl-cred
      name: dsh-wsl-cred
      config:
        timeoutMs: 10000

    - id: dsh-wsl-github
      name: dsh-wsl-github
      config:
        timeoutMs: 20000
        appId: ""
        privateKeyPath: ""
        installationId: ""

    - id: dsh-wsl-notify
      name: dsh-wsl-notify
      config:
        timeoutMs: 30000
        maxLen: 500

    - id: dsh-wsl-browser
      name: dsh-wsl-browser
      config:
        timeoutMs: 15000

    - id: dsh-wsl-workspace
      name: dsh-wsl-workspace
      config:
        timeoutMs: 15000

    - id: dsh-wsl-picker
      name: dsh-wsl-picker
      config:
        timeoutMs: 15000
        maxEntries: 200

    - id: dsh-wsl-tray
      name: dsh-wsl-tray
      config:
        timeoutMs: 30000

    - id: dsh-wsl-expose
      name: dsh-wsl-expose
      config:
        timeoutMs: 30000
        defaultPort: 3080

    - id: dsh-wsl-hostsvc
      name: dsh-wsl-hostsvc
      config:
        timeoutMs: 15000

    - id: dsh-wsl-clock
      name: dsh-wsl-clock
      config:
        timeoutMs: 15000
        maxSkewSec: 30

    - id: dsh-wsl-dns
      name: dsh-wsl-dns
      config:
        timeoutMs: 20000

    - id: dsh-wsl-mnt
      name: dsh-wsl-mnt
      config:
        timeoutMs: 10000

    - id: dsh-wsl-editor
      name: dsh-wsl-editor
      config:
        timeoutMs: 20000

    - id: dsh-wsl-shot
      name: dsh-wsl-shot
      config:
        timeoutMs: 30000

    - id: dsh-wsl-docker
      name: dsh-wsl-docker
      config:
        timeoutMs: 20000

    - id: dsh-wsl-ssh-agent
      name: dsh-wsl-ssh-agent
      config:
        timeoutMs: 15000

    - id: dsh-wsl-encoding
      name: dsh-wsl-encoding
      config:
        timeoutMs: 15000

    - id: dsh-wsl-wslconfig
      name: dsh-wsl-wslconfig
      config:
        timeoutMs: 10000

    - id: dsh-wsl-download
      name: dsh-wsl-download
      config:
        timeoutMs: 30000
